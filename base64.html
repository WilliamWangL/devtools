<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="base64.title">Base64 Encode/Decode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4 text-purple-600 dark:text-purple-400">
                <a href="index.html" class="p-2 -ml-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors" title="Back to Home">
                    <i data-lucide="arrow-left"></i>
                </a>
                <div class="flex items-center gap-2">
                    <i data-lucide="file-code-2"></i>
                    <span class="font-bold text-xl text-gray-900 dark:text-white" data-i18n="base64.title">Base64 Encode/Decode</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-lg transition-colors" title="Toggle Theme" data-i18n="theme.toggle">
                    <i data-lucide="sun" class="hidden dark:block"></i>
                    <i data-lucide="moon" class="block dark:hidden"></i>
                </button>
                <button onclick="toggleLanguage()" class="px-3 py-1 text-sm font-medium border border-gray-300 dark:border-gray-700 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <span id="lang-toggle-text">中文</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 flex flex-col max-w-5xl h-[calc(100vh-4rem)]">
        <div class="flex flex-col gap-6 h-full pb-8">
            <div class="flex-1 flex flex-col">
                <label for="input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Input</label>
                <textarea id="input" class="w-full flex-1 p-4 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition-shadow outline-none resize-none font-mono text-sm shadow-sm" placeholder="Type or paste text here..." data-i18n="base64.input"></textarea>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-4">
                <button onclick="encodeBase64()" class="flex items-center gap-2 px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white rounded-xl shadow-sm transition-transform hover:scale-105 font-medium">
                    <i data-lucide="arrow-down-to-line" class="w-5 h-5"></i>
                    <span data-i18n="btn.encode">Encode</span>
                </button>
                <button onclick="decodeBase64()" class="flex items-center gap-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm transition-transform hover:scale-105 font-medium">
                    <i data-lucide="arrow-up-from-line" class="w-5 h-5"></i>
                    <span data-i18n="btn.decode">Decode</span>
                </button>
                <button onclick="clearText()" class="flex items-center gap-2 px-4 py-3 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-xl transition-colors font-medium ml-auto">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span data-i18n="btn.clear">Clear</span>
                </button>
            </div>

            <div class="flex-1 flex flex-col relative group">
                <label for="output" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Output</label>
                <textarea id="output" readonly class="w-full flex-1 p-4 bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl outline-none resize-none font-mono text-sm shadow-sm text-gray-900 dark:text-gray-100"></textarea>
                
                <button onclick="copyOutput()" class="absolute top-10 right-4 p-2 bg-white dark:bg-gray-700 shadow border border-gray-200 dark:border-gray-600 rounded-lg text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-all opacity-0 group-hover:opacity-100" title="Copy Output">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="js/tools/base64.js"></script>
</body>
</html>
