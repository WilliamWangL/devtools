<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="sha256.title">SHA-256 Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4 text-cyan-600 dark:text-cyan-400">
                <a href="index.html" class="p-2 -ml-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors" title="Back to Home">
                    <i data-lucide="arrow-left"></i>
                </a>
                <div class="flex items-center gap-2">
                    <i data-lucide="shield"></i>
                    <span class="font-bold text-xl text-gray-900 dark:text-white" data-i18n="sha256.title">SHA-256 Generator</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-lg transition-colors" title="Toggle Theme" data-i18n="theme.toggle">
                    <i data-lucide="sun" class="hidden dark:block"></i>
                    <i data-lucide="moon" class="block dark:hidden"></i>
                </button>
                <button onclick="toggleLanguage()" class="px-3 py-1 text-sm font-medium border border-gray-300 dark:border-gray-700 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <span id="lang-toggle-text">中文</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex flex-col gap-6">
            <div class="flex flex-col relative">
                <label for="input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Input Text</label>
                <textarea id="input" rows="8" class="w-full p-4 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition-shadow outline-none resize-none font-mono shadow-sm text-gray-900 dark:text-white" placeholder="Type here..." data-i18n="hash.input" oninput="generateSHA256()"></textarea>
                <button onclick="clearText()" class="absolute top-10 right-4 p-2 text-gray-400 hover:text-red-500 transition-colors" title="Clear">
                    <i data-lucide="x-circle" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="bg-gray-50 dark:bg-gray-800/50 p-6 border border-gray-200 dark:border-gray-700 rounded-xl">
                <div class="flex justify-between items-center mb-3">
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider" data-i18n="hash.result">SHA-256 Hash</label>
                    <button onclick="copyOutput()" class="flex items-center gap-1 text-cyan-600 hover:text-cyan-700 dark:text-cyan-400 font-medium text-sm transition-colors">
                        <i data-lucide="copy" class="w-4 h-4"></i> <span data-i18n="btn.copy">Copy</span>
                    </button>
                </div>
                <div class="p-4 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg break-all font-mono text-lg text-gray-900 dark:text-gray-100 shadow-inner" id="output">
                    <!-- Hash appears here -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/tools/sha256.js"></script>
</body>
</html>
