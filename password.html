<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pwd.title">Password Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4 text-pink-600 dark:text-pink-400">
                <a href="index.html" class="p-2 -ml-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors" title="Back to Home">
                    <i data-lucide="arrow-left"></i>
                </a>
                <div class="flex items-center gap-2">
                    <i data-lucide="key"></i>
                    <span class="font-bold text-xl text-gray-900 dark:text-white" data-i18n="pwd.title">Password Generator</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-lg transition-colors" title="Toggle Theme" data-i18n="theme.toggle">
                    <i data-lucide="sun" class="hidden dark:block"></i>
                    <i data-lucide="moon" class="block dark:hidden"></i>
                </button>
                <button onclick="toggleLanguage()" class="px-3 py-1 text-sm font-medium border border-gray-300 dark:border-gray-700 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <span id="lang-toggle-text">中文</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-12 max-w-2xl">
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4 text-center" data-i18n="pwd.page.desc">Generate strong, random passwords with customizable options.</p>
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-3xl shadow-sm p-8">
            <!-- Output -->
            <div class="relative mb-8 group">
                <div id="password-display" class="w-full bg-gray-50 dark:bg-gray-800 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl p-6 text-center font-mono text-3xl font-medium tracking-wider text-gray-900 dark:text-white break-all select-all transition-colors group-hover:border-pink-400">
                    <!-- password here -->
                </div>
                <button onclick="copyPassword()" class="absolute top-1/2 right-4 -translate-y-1/2 p-3 bg-white dark:bg-gray-700 shadow-md rounded-xl text-gray-600 hover:text-pink-600 dark:text-gray-300 dark:hover:text-pink-400 transition-transform hover:scale-110">
                    <i data-lucide="copy" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Controls -->
            <div class="space-y-6 mb-8">
                <!-- Length Slider -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-medium text-gray-700 dark:text-gray-300" data-i18n="pwd.length">Password Length</label>
                        <span id="length-val" class="text-xl font-bold text-pink-600 dark:text-pink-400 w-8 text-right">16</span>
                    </div>
                    <input type="range" id="length" min="6" max="64" value="16" class="w-full h-2 bg-gray-200 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-pink-600" oninput="updateLength(this.value)">
                </div>

                <!-- Checkboxes -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors">
                        <input type="checkbox" id="uppercase" checked class="w-5 h-5 text-pink-600 rounded border-gray-300 focus:ring-pink-500">
                        <span class="text-gray-700 dark:text-gray-300 font-medium" data-i18n="pwd.uppercase">Uppercase (A-Z)</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors">
                        <input type="checkbox" id="lowercase" checked class="w-5 h-5 text-pink-600 rounded border-gray-300 focus:ring-pink-500">
                        <span class="text-gray-700 dark:text-gray-300 font-medium" data-i18n="pwd.lowercase">Lowercase (a-z)</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors">
                        <input type="checkbox" id="numbers" checked class="w-5 h-5 text-pink-600 rounded border-gray-300 focus:ring-pink-500">
                        <span class="text-gray-700 dark:text-gray-300 font-medium" data-i18n="pwd.numbers">Numbers (0-9)</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-gray-800 rounded-xl cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-750 transition-colors">
                        <input type="checkbox" id="symbols" checked class="w-5 h-5 text-pink-600 rounded border-gray-300 focus:ring-pink-500">
                        <span class="text-gray-700 dark:text-gray-300 font-medium" data-i18n="pwd.symbols">Symbols (!@#$%)</span>
                    </label>
                </div>
            </div>

            <!-- Generate Button -->
            <button onclick="generatePassword()" class="w-full flex items-center justify-center gap-2 py-4 bg-pink-600 hover:bg-pink-700 text-white rounded-xl font-bold text-lg transition-transform hover:scale-[1.02] shadow-lg shadow-pink-500/30">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                <span data-i18n="pwd.btn">Generate Password</span>
            </button>
        </div>
    </main>

    <script src="js/tools/password.js"></script>
</body>
</html>
