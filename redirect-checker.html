<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="redirect.title">Redirect Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full border-b border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-4 text-amber-600 dark:text-amber-400">
                <a href="index.html" class="p-2 -ml-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-colors" title="Back to Home">
                    <i data-lucide="arrow-left"></i>
                </a>
                <div class="flex items-center gap-2">
                    <i data-lucide="route"></i>
                    <span class="font-bold text-xl text-gray-900 dark:text-white" data-i18n="redirect.title">Redirect Checker</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleTheme()" class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-lg transition-colors" title="Toggle Theme" data-i18n="theme.toggle">
                    <i data-lucide="sun" class="hidden dark:block"></i>
                    <i data-lucide="moon" class="block dark:hidden"></i>
                </button>
                <button onclick="toggleLanguage()" class="px-3 py-1 text-sm font-medium border border-gray-300 dark:border-gray-700 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    <span id="lang-toggle-text">中文</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 flex flex-col max-w-4xl min-h-[calc(100vh-4rem)]">
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-3" data-i18n="redirect.page.desc">Trace HTTP redirect chains for any URL. Results may be limited by browser CORS policy.</p>

        <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl p-6 shadow-sm mb-6">
            <label for="url-input" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" data-i18n="redirect.input">Enter URL to check</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="url-input" class="flex-1 px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none font-mono text-sm text-gray-900 dark:text-white" placeholder="https://example.com">
                <button onclick="checkRedirects()" class="flex items-center justify-center gap-2 px-6 py-3 bg-amber-600 hover:bg-amber-700 text-white rounded-xl shadow-sm transition-transform hover:scale-105 font-medium whitespace-nowrap">
                    <i data-lucide="search" class="w-5 h-5"></i>
                    <span data-i18n="redirect.btn">Check Redirects</span>
                </button>
            </div>
        </div>

        <div id="result-area" class="hidden">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-semibold text-gray-900 dark:text-white" data-i18n="redirect.result">Redirect Chain</h2>
                <span id="redirect-count" class="text-xs font-medium px-2 py-1 bg-gray-100 dark:bg-gray-700 rounded-md text-gray-600 dark:text-gray-300"></span>
            </div>
            <div id="chain-container" class="space-y-3"></div>
        </div>

        <div id="error-area" class="hidden mt-4 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl text-red-700 dark:text-red-400 text-sm"></div>
    </main>

    <script src="js/tools/redirect-checker.js"></script>
</body>
</html>
